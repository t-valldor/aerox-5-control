[package]
name = "aerox5-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "GUI for configuring the SteelSeries Aerox 5 Wireless mouse"

[dependencies]
chrono = "0.4"
eframe = "0.31"
hidapi = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
io-kit-sys = "0.5"
libc = "0.2"

# BeautifulRust drop-in lints (https://github.com/morganlinton/BeautifulRust).
# This crate is a binary, so the upstream [lib] lints (missing_docs,
# missing_panics_doc, missing_errors_doc, exhaustive_enums, print_stdout,
# print_stderr) are intentionally omitted. `unreachable_pub` is also omitted: in a
# binary every `pub` item is crate-internal by design. Protocol and UI helpers
# use explicit state enums (`Link`, `WidgetState`, `Selection`, …) instead of
# bool parameters, so the pedantic bool rule stays enabled. Enforce in CI with:
#     cargo clippy --all-targets --all-features -- -D warnings
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"

undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"

string_add = "warn"
wildcard_imports = "warn"

dbg_macro = "warn"
todo = "warn"

as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"

module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
